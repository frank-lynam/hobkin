[build-system]
requires = ["flit_core>=3.12,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "hobkin"
description = "Unattended AI agents you run, talk to and inspect through plain files: one process each, no ports, one stdlib-only file."
dynamic = ["version"]   # from hobkin.__version__
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Frank Lynam" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["agent", "llm", "ai", "unattended", "autonomous", "cli", "claude", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/frank-lynam/hobkin"
Issues = "https://github.com/frank-lynam/hobkin/issues"

[project.scripts]
hobkin = "hobkin:cli"

[tool.flit.sdist]
include = ["tests/"]
exclude = ["CLAUDE.md", "AGENTS.md"]
