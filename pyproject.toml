[build-system]
requires = ["flit_core>=3.12,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "hobkin"
description = "An AI agent for austere environments: one stdlib-only Python file, no installs, no open ports. Use it from the command line, or as a worker on hearthboard."
dynamic = ["version"]   # from hobkin.__version__
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Frank Lynam" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["agent", "llm", "ai", "unattended", "autonomous", "cli", "claude", "openai", "hearthboard"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
]

[project.optional-dependencies]
lore = ["lorewell>=0.4"]   # the field lore: what hobkins learn about their people and code bases, kept and recalled
chat = ["hearthside>=0.4"]   # hobkin chat's full editor: multi-line input, output above it, a status bar
all = ["lorewell>=0.5", "hearthside>=0.4"]   # everything: pip install "hobkin[all]"

[project.urls]
Homepage = "https://github.com/frank-lynam/hobkin"
Issues = "https://github.com/frank-lynam/hobkin/issues"

[project.scripts]
hobkin = "hobkin:cli"

[tool.flit.sdist]
include = ["tests/"]
exclude = ["CLAUDE.md", "AGENTS.md"]
